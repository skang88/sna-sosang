<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캡컷 에이전트</title>
<style>
  :root{
    --bg:#0a0a0a; --card:#161616; --border:#262626; --border-hi:#333;
    --text:#ededed; --dim:#8f8f8f; --faint:#5a5a5a;
    --green:#22c55e; --red:#ef4444;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; padding:64px 24px 96px;
  }
  .wrap{width:100%; max-width:620px}

  header{margin-bottom:36px}
  h1{font-size:15px; font-weight:600; letter-spacing:-.01em}
  header p{color:var(--faint); font-size:13px; margin-top:5px}

  /* ── 드롭존 ── */
  .drop{
    border:1px dashed var(--border-hi); border-radius:10px;
    padding:44px 24px; text-align:center; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .drop:hover{border-color:#454545; background:#0f0f0f}
  .drop.over{border-color:var(--green); background:rgba(34,197,94,.04)}
  .drop strong{display:block; font-size:13px; font-weight:500}
  .drop span{display:block; color:var(--faint); font-size:12px; margin-top:6px}
  .drop.busy{opacity:.4; pointer-events:none}
  input[type=file]{display:none}

  /* ── 카드 ── */
  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:10px; margin-top:20px;
  }
  .row{padding:14px 18px}
  .row + .row{border-top:1px solid var(--border)}

  .meta{
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
    color:var(--dim); font-size:12px;
  }
  .meta b{color:var(--text); font-weight:500}
  .meta code{font-family:var(--mono); font-variant-numeric:tabular-nums}

  /* ── 스텝퍼 ── */
  .step{display:flex; align-items:center; gap:11px; padding:9px 18px}
  .step + .step{border-top:1px solid var(--border)}
  .dot{
    width:6px; height:6px; border-radius:50%; flex:none;
    background:var(--faint); transition:background .2s, box-shadow .2s;
  }
  .step[data-s=running] .dot{background:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,.16); animation:pulse 1.1s ease-in-out infinite}
  .step[data-s=done]    .dot{background:var(--green)}
  .step[data-s=error]   .dot{background:var(--red); box-shadow:0 0 0 3px rgba(239,68,68,.16)}
  .step[data-s=skipped] .dot{background:#2e2e2e}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
  .step .label{flex:1; font-size:13px; color:var(--dim)}
  .step[data-s=running] .label,.step[data-s=done] .label{color:var(--text)}
  .step[data-s=skipped] .label{color:#4a4a4a}
  .step .detail{font-size:12px; color:var(--faint); font-family:var(--mono); font-variant-numeric:tabular-nums}

  /* ── 통계 3열 ── */
  .stats{display:grid; grid-template-columns:repeat(3,1fr)}
  .stat{padding:16px 18px}
  .stat + .stat{border-left:1px solid var(--border)}
  .stat .n{
    font-size:20px; font-weight:550; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; font-family:var(--mono);
  }
  .stat .n.hl{color:var(--green)}
  .stat .k{color:var(--faint); font-size:11px; margin-top:3px}

  /* ── 구간 목록 ── */
  .cuts{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
  .cut{display:flex; gap:12px; padding:4px 0; color:var(--dim)}
  .cut i{color:var(--faint); font-style:normal; width:18px; text-align:right}
  .cut b{color:var(--text); font-weight:400}
  .cut em{color:var(--faint); font-style:normal; margin-left:auto}

  /* ── 옵션 ── */
  .opts{display:flex; gap:10px; align-items:center; margin-top:14px}
  .opts input[type=text]{
    flex:1; font:inherit; font-size:12.5px; color:var(--text);
    background:var(--card); border:1px solid var(--border);
    border-radius:6px; padding:7px 10px;
  }
  .opts input[type=text]:focus{outline:none; border-color:#454545}
  .opts input::placeholder{color:#4a4a4a}
  .opts label{display:flex; gap:6px; align-items:center; color:var(--dim);
              font-size:12.5px; cursor:pointer; white-space:nowrap}
  .opts input[type=checkbox]{accent-color:var(--green)}
  .opts input[type=number]{
    width:72px; font:inherit; font-size:12.5px; font-family:var(--mono);
    font-variant-numeric:tabular-nums; color:var(--text);
    background:var(--card); border:1px solid var(--border);
    border-radius:6px; padding:5px 7px;
  }
  .opts input[type=number]:focus{outline:none; border-color:#454545}
  /* 스피너가 좁은 칸을 먹어 값이 잘려 보인다 */
  .opts input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .note{color:var(--faint); font-size:11.5px; margin-top:7px; line-height:1.6}
  .note b{color:var(--dim); font-weight:500; font-family:var(--mono)}

  /* ── 대본 · 컷 ── */
  .sect{color:var(--faint); font-size:11px; margin-bottom:8px;
        letter-spacing:.04em; text-transform:uppercase}
  .script{color:var(--dim); font-size:12.5px; line-height:1.75;
          max-height:200px; overflow-y:auto}
  .cutlist{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums;
           max-height:180px; overflow-y:auto}
  .cutrow{display:flex; gap:10px; padding:3px 0; color:var(--dim)}
  .cutrow .tag{color:var(--faint); width:34px; flex:none}
  .cutrow .t{color:var(--faint); width:52px; flex:none; text-align:right}
  .subs{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums;
        max-height:220px; overflow-y:auto}
  .sub{display:flex; gap:10px; padding:3px 0; color:var(--dim)}
  .sub .t{color:var(--faint); width:98px; flex:none}

  code.chip{
    font-family:var(--mono); font-size:11.5px; color:var(--dim);
    background:#1e1e1e; border:1px solid var(--border);
    border-radius:4px; padding:2px 6px; word-break:break-all;
  }
  .hint{color:var(--faint); font-size:12px; line-height:1.6}
  .hint b{color:var(--dim); font-weight:500}

  button{
    font:inherit; font-size:12.5px; color:var(--text);
    background:#1e1e1e; border:1px solid var(--border-hi);
    border-radius:6px; padding:6px 12px; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button:hover{background:#262626; border-color:#454545}
  .actions{display:flex; gap:8px; align-items:center}
  .err{color:var(--red); font-size:12.5px; font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>캡컷 에이전트</h1>
    <p>무음 구간을 잘라 캡컷 드래프트를 만듭니다.</p>
  </header>

  <div class="drop" id="drop">
    <strong>영상을 여기에 놓으세요</strong>
    <span>또는 클릭해서 선택 &middot; mp4 mov m4v mkv webm</span>
  </div>
  <input type="file" id="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v,.mkv,.webm">

  <div class="opts">
    <input type="text" id="glossary" placeholder="사전 — 굿네이버스, 결혼아동&gt;결연아동, 푸른편&gt;프놈펜">
    <label title="그·저·뭐·좀 같은 담화표지까지 제거합니다. 뜻이 있는 말이라 과하게 잘릴 수 있습니다.">
      <input type="checkbox" id="aggressive"> 잔말 강하게
    </label>
  </div>
  <div class="opts">
    <label>자막 크기 <input type="number" id="size" value="21" min="8" max="60" step="1"></label>
    <label>배경 <input type="checkbox" id="bg" checked></label>
    <label>불투명도 <input type="number" id="bgalpha" value="0.7" min="0" max="1" step="0.05"></label>
    <label>세로 위치 <input type="number" id="ypos" value="-0.77" min="-1" max="1" step="0.02"></label>
  </div>
  <p class="note"><b>틀린말&gt;맞는말</b> 은 확정 치환(즉시 반영), 그냥 쓴 낱말은 인식 유도.
    유도는 잘 안 듣습니다 — 꼭 고쳐야 하면 치환을 쓰세요.
    상시 규칙은 <b>glossary.txt</b> 에 적어두면 매번 자동 적용됩니다.</p>

  <div id="out"></div>
</div>

<script>
const drop = document.getElementById('drop');
const input = document.getElementById('file');
const out = document.getElementById('out');

const pad2 = n => String(n).padStart(2,'0');
const dur = s => `${Math.floor(s/60)}:${pad2(Math.floor(s%60))}.${pad2(Math.floor(s*100%100))}`;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

drop.onclick = () => input.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) start(e.dataTransfer.files[0]);
};
input.onchange = () => input.files[0] && start(input.files[0]);

async function start(file){
  out.innerHTML = '';
  drop.classList.add('busy');
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/api/jobs', {method:'POST', body:fd});
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const {job_id} = await res.json();
    const q = new URLSearchParams();
    const g = document.getElementById('glossary').value.trim();
    if (g) q.set('glossary', g);
    if (document.getElementById('aggressive').checked) q.set('aggressive', '1');
    q.set('size', document.getElementById('size').value);
    q.set('ypos', document.getElementById('ypos').value);
    if (document.getElementById('bg').checked)
      q.set('bgalpha', document.getElementById('bgalpha').value);
    else q.set('bg', 'off');
    listen(job_id, q);
  } catch (e) {
    out.innerHTML = `<div class="card"><div class="row err">업로드 실패 — ${esc(e.message)}</div></div>`;
    drop.classList.remove('busy');
  }
}

function listen(jobId, q){
  const metaCard = el('div','card'); metaCard.style.display='none';
  const stepCard = el('div','card');
  out.append(metaCard, stepCard);

  const steps = {};
  const qs = q && q.toString() ? `?${q}` : '';
  const es = new EventSource(`/api/jobs/${jobId}/stream${qs}`);

  es.onmessage = ev => {
    const m = JSON.parse(ev.data);

    if (m.type === 'stages'){
      for (const s of m.stages){
        const row = el('div','step');
        row.dataset.s = s.enabled ? 'pending' : 'skipped';
        row.innerHTML = `<i class="dot"></i><span class="label">${esc(s.label)}</span><span class="detail"></span>`;
        stepCard.append(row);
        steps[s.key] = row;
      }
    }

    if (m.type === 'meta'){
      const d = m.meta;
      metaCard.style.display = '';
      metaCard.innerHTML = `<div class="row meta">
        <b>${esc(d.name)}</b>
        <code>${d.width}&times;${d.height}</code>
        <code>${d.fps}fps</code>
        <code>${dur(d.duration_us/1e6)}</code>
        <code>${esc(d.hash)}</code>
      </div>`;
    }

    if (m.type === 'stage'){
      const row = steps[m.key]; if (!row) return;
      row.dataset.s = m.status;
      row.querySelector('.detail').textContent = m.detail || '';
    }

    if (m.type === 'done'){ es.close(); result(m.result); }

    if (m.type === 'error'){
      es.close();
      drop.classList.remove('busy');
      const c = el('div','card');
      c.innerHTML = `<div class="row err">${esc(m.message)}</div>`;
      out.append(c);
    }
  };

  es.onerror = () => { es.close(); drop.classList.remove('busy'); };
}

function result(r){
  drop.classList.remove('busy');
  const c = el('div','card');
  c.innerHTML = `
    <div class="row stats" style="padding:0">
      <div class="stat"><div class="n">${dur(r.source_us/1e6)}</div><div class="k">원본</div></div>
      <div class="stat"><div class="n">${dur(r.kept_us/1e6)}</div><div class="k">결과</div></div>
      <div class="stat"><div class="n hl">${r.removed_pct}%</div><div class="k">제거</div></div>
    </div>
    ${r.cuts.length ? `<div class="row">
      <div class="sect">제거한 구간 ${r.cuts.length}</div>
      <div class="cutlist">${r.cuts.map(c=>
        `<div class="cutrow"><span class="tag">${c.reason==='ng'?'NG':'잔말'}</span><span class="t">${dur(c.start)}</span><span>${esc(c.text)}</span></div>`
      ).join('')}</div></div>` : ''}
    ${r.flagged && r.flagged.length ? `<div class="row">
      <div class="sect">확인 필요 ${r.flagged.length} — 버벅임 의심이지만 자를 지점을 특정 못함</div>
      <div class="cutlist">${r.flagged.map(c=>
        `<div class="cutrow"><span class="tag">?</span><span class="t">${dur(c.start)}</span><span>${esc(c.text)}</span></div>`
      ).join('')}</div></div>` : ''}
    ${r.cues.length ? `<div class="row">
      <div class="sect">자막 ${r.cues.length}줄</div>
      <div class="subs">${r.cues.map(c=>
        `<div class="sub"><span class="t">${dur(c.start)}&ndash;${dur(c.end)}</span><span>${esc(c.text)}</span></div>`
      ).join('')}</div></div>` : ''}
    ${r.script ? `<div class="row">
      <div class="sect">대본 ${r.script.length}자</div>
      <div class="script">${esc(r.script)}</div></div>` : ''}
    <div class="row actions">
      <code class="chip">${esc(r.draft_name)}</code>
      <button id="reveal">Finder에서 열기</button>
    </div>
    <div class="row hint">
      캡컷을 <b>완전히 종료 후 재실행</b>해야 목록에 나타납니다.<br>
      드래프트를 열어 <b>직접 재생</b>해서 확인하세요 — 생성 성공이 검증은 아닙니다.
    </div>`;
  out.append(c);
  c.querySelector('#reveal').onclick = () =>
    fetch('/api/reveal', {method:'POST', headers:{'Content-Type':'application/json'},
                          body: JSON.stringify({path: r.draft_path})});
}

function el(tag, cls){ const e = document.createElement(tag); e.className = cls; return e; }
</script>
</body>
</html>
